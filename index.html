'use strict';const DATA=[{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.1–2.3","title":"Para que servem as características qualitativas","explanation":"O Capítulo 2 identifica quais qualidades tornam informações financeiras úteis aos investidores, credores por empréstimos e outros credores.","points":["A análise considera as informações financeiras apresentadas em relatórios para fins gerais."],"example":"A utilidade depende tanto do conteúdo econômico quanto da forma como ele é representado.","tip":"Questões de prova podem confundir utilidade com quantidade de informações."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.4–2.5","title":"Dois grupos de características","explanation":"A norma organiza as características em fundamentais e de melhoria. Uma informação útil deve ser relevante e representar fidedignamente o que pretende representar.","points":["Fundamentais: relevância e representação fidedigna. De melhoria: comparabilidade, capacidade de verificação, tempestividade e compreensibilidade."],"example":"Uma divulgação muito fácil de comparar não se torna útil se o fato relatado for irrelevante.","tip":"Memorize 2 fundamentais + 4 de melhoria."},{"kind":"quiz","ref":"2.4–2.5","title":"Questão 1 • Dois grupos de características","quiz":{"n":1,"original":24,"bank":"FCC - FTE (SEFAZ MT)/SEFAZ MT/2026","question":"Segundo o CPC 00 (R2), uma informação financeira, para ser útil, deve possuir duas características fundamentais e pode ter sua utilidade ampliada por características de melhoria. Assinale a alternativa correta:","options":{"A":"A informação deve ser compreensível e fidedigna, sendo a relevância apenas uma melhoria.","B":"A informação deve ser verificável e compreensível, sendo relevância apenas melhoria.","C":"A informação deve ser fidedigna e tempestiva, sendo relevância uma melhoria.","D":"A informação deve ser relevante e representar fidedignamente o fenômeno; sua utilidade aumenta com comparabilidade, verificabilidade, tempestividade e compreensibilidade.","E":"A informação deve ser compreensível e relevante, sendo a representação fidedigna apenas melhoria."},"answer":"D","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Relevância e representação fidedigna são fundamentais; as quatro outras são de melhoria (2.5, 2.23).","url":"https://www.tecconcursos.com.br/questoes/3863562"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.6","title":"Relevância","explanation":"Informação relevante é aquela capaz de fazer diferença nas decisões dos usuários. Não é necessário que todas as pessoas mudem efetivamente sua decisão para que a informação seja relevante.","points":["Ela pode ter valor preditivo, valor confirmatório ou os dois."],"example":"Um indicador de vendas pode ajudar a prever receitas futuras.","tip":"Relevância é característica fundamental."},{"kind":"quiz","ref":"2.6","title":"Questão 2 • Relevância","quiz":{"n":2,"original":22,"bank":"FCM - CEFETMINAS - PEBTT (IF AM)/IF AM/Contabilidade/2026","question":"A respeito das características qualitativas das informações financeiras úteis, assinale a alternativa correta:","options":{"A":"A comparabilidade aumenta quando se descrevem acontecimentos distintos como se fossem iguais.","B":"Fenômenos complexos devem ser omitidos para facilitar a compreensão.","C":"Representação fidedigna é sinônimo de disponibilização tempestiva de informação.","D":"Uma informação é material quando sua omissão nunca influencia os usuários.","E":"Informações relevantes podem fazer diferença nas decisões dos usuários, inclusive por seu valor preditivo ou confirmatório."},"answer":"E","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Relevância inclui valor preditivo, confirmatório ou ambos (2.6–2.10).","url":"https://www.tecconcursos.com.br/questoes/3854534"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.7–2.8","title":"Valor preditivo","explanation":"A informação tem valor preditivo se puder ser usada como dado de entrada para prever resultados futuros. Ela própria não precisa ser uma previsão ou projeção.","points":["Os usuários podem empregar dados históricos, como margens e vendas, em seus próprios modelos de previsão."],"example":"O histórico de inadimplência ajuda a estimar perdas futuras.","tip":"Não confunda valor preditivo com relatório obrigatoriamente prospectivo."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.9–2.10","title":"Valor confirmatório","explanation":"Informação com valor confirmatório permite confirmar ou corrigir avaliações anteriores. Os valores preditivo e confirmatório estão frequentemente relacionados.","points":["Resultados atuais podem confirmar ou modificar expectativas feitas no passado."],"example":"Lucro efetivo diferente do esperado faz o investidor rever sua análise.","tip":"Uma informação pode ter valor preditivo e confirmatório ao mesmo tempo."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.11","title":"Materialidade","explanation":"Informação é material se sua omissão, distorção ou obscuridade puder razoavelmente influenciar decisões de usuários primários, com base nos relatórios de propósito geral.","points":["Depende da natureza ou magnitude, ou de ambas, no contexto da entidade; não existe percentual universal aplicável a toda empresa."],"example":"Uma transação pequena em valor pode ser material por envolver parte relacionada relevante.","tip":"Materialidade é aspecto específico da relevância."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.12–2.13","title":"Representação fidedigna","explanation":"Além de relevante, a informação deve representar de forma fidedigna a essência do fenômeno econômico. A representação perfeitamente fidedigna apresenta três características.","points":["Completude, neutralidade e ausência de erros. A perfeição é um objetivo, embora nem sempre alcançável."],"example":"Uma nota explicativa identifica a transação, a metodologia e as premissas relevantes.","tip":"A expressão-chave é: completa, neutra e livre de erros."},{"kind":"quiz","ref":"2.12–2.13","title":"Questão 3 • Representação fidedigna","quiz":{"n":3,"original":124,"bank":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","question":"Segundo a NBC TG Estrutura Conceitual, para a representação da informação financeira ser fidedigna, ela deve ser:","options":{"A":"completa, neutra e isenta de erros.","B":"confiável, tempestiva e com erros mínimos.","C":"tempestiva, útil e comparável.","D":"consistente, completa e compreensível."},"answer":"A","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Representação fidedigna perfeita é completa, neutra e livre de erros (2.13).","url":"https://www.tecconcursos.com.br/questoes/3349470"}},{"kind":"quiz","ref":"2.12–2.13","title":"Questão 4 • Representação fidedigna","quiz":{"n":4,"original":17,"bank":"Instituto AOCP - Cont (UNIRIO)/UNIRIO/2026","question":"Um contador prepara demonstrações para representar a essência econômica das transações, e não somente sua forma jurídica. Qual característica qualitativa FUNDAMENTAL está sendo observada?","options":{"A":"Relevância.","B":"Representação fidedigna.","C":"Comparabilidade.","D":"Compreensibilidade.","E":"Consistência."},"answer":"B","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Representar a essência econômica da transação é requisito da representação fidedigna (2.12).","url":"https://www.tecconcursos.com.br/questoes/3843094"}},{"kind":"quiz","ref":"2.12–2.13","title":"Questão 5 • Representação fidedigna","quiz":{"n":5,"original":18,"bank":"Instituto AOCP - Tec (UNIRIO)/UNIRIO/Contabilidade/2026","question":"A característica qualitativa fundamental para a qual a informação deve ser completa, neutra e livre de erros é denominada:","options":{"A":"relevância.","B":"conformidade.","C":"consistência.","D":"verificabilidade.","E":"representação fidedigna."},"answer":"E","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Os três atributos da representação perfeitamente fidedigna são completude, neutralidade e ausência de erros (2.13).","url":"https://www.tecconcursos.com.br/questoes/3851025"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.14","title":"Completude","explanation":"Representação completa contém as informações necessárias para que o usuário compreenda o fenômeno retratado, inclusive descrições e explicações relevantes.","points":["Completude não significa publicar todos os dados possíveis: importa o que é necessário para entender o fenômeno."],"example":"Relatar uma obrigação relevante sem explicar suas condições pode tornar a divulgação incompleta.","tip":"Omissão de detalhes essenciais compromete a representação fidedigna."},{"kind":"quiz","ref":"2.14","title":"Questão 6 • Completude","quiz":{"n":6,"original":406,"bank":"FGV - AJ (TJ RR)/TJ RR/Contabilidade/2024","question":"Uma entidade omitiu transações relevantes com derivativos de suas demonstrações contábeis para tornar os relatórios mais simples de ler. Qual característica qualitativa fundamental foi diretamente prejudicada?","options":{"A":"A relevância é plenamente atendida pela omissão de transações importantes.","B":"A prudência exige excluir operações complexas das demonstrações.","C":"A característica prejudicada é somente a tempestividade.","D":"A representação fidedigna foi prejudicada porque a omissão torna o relato incompleto.","E":"A omissão demonstra maior verificabilidade da informação."},"answer":"D","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Omissão de transações relevantes compromete a completude, componente da representação fidedigna (2.13–2.14).","url":"https://www.tecconcursos.com.br/questoes/3166710"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.15","title":"Neutralidade","explanation":"Neutralidade é ausência de viés na seleção ou apresentação das informações financeiras. A apresentação não deve favorecer resultados ou decisões predeterminadas.","points":["Informação neutra não é manipulada para parecer mais favorável ou mais desfavorável."],"example":"Manter uma estimativa desatualizada apenas para elevar o lucro prejudica a neutralidade.","tip":"Neutralidade não exige ignorar riscos: exige imparcialidade no relato."},{"kind":"quiz","ref":"2.15","title":"Questão 7 • Neutralidade","quiz":{"n":7,"original":62,"bank":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026","question":"Uma empresa costumava estimar perdas com inadimplência de 2% sobre clientes. Após flexibilizar a concessão de crédito, passou a esperar perdas de aproximadamente 5%, mas manteve a estimativa de 2% para apresentar resultados melhores. A informação deixa de representar fidedignamente a realidade porque:","options":{"A":"pode ser considerada adequada apenas porque permite comparações.","B":"pode ser considerada adequada por ter sido divulgada tempestivamente.","C":"não é neutra, pois a estimativa foi escolhida para favorecer a apresentação do resultado.","D":"não pode ser fidedigna somente porque não há como verificar qualquer estimativa."},"answer":"C","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"A neutralidade proíbe escolha tendenciosa de informações para produzir resultado predeterminado (itens 2.15–2.16).","url":"https://www.tecconcursos.com.br/questoes/3992056"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.16","title":"Prudência e neutralidade","explanation":"Prudência é o exercício de cautela ao realizar julgamentos sob condições de incerteza. Ela apoia a neutralidade e não autoriza subavaliar deliberadamente ativos ou receitas, ou superavaliar passivos e despesas.","points":["A norma não exige assimetria sistemática no reconhecimento de elementos patrimoniais."],"example":"Uma perda estimada deve refletir evidências; nem omitir riscos nem exagerá-los deliberadamente.","tip":"Prudência não significa pessimismo contábil."},{"kind":"quiz","ref":"2.16","title":"Questão 8 • Prudência e neutralidade","quiz":{"n":8,"original":206,"bank":"FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2025","question":"A neutralidade é componente da representação fidedigna. Segundo o CPC 00 (R2), uma informação neutra pode:","options":{"A":"ser parcial.","B":"ser prudente.","C":"possuir inclinações.","D":"ser tendenciosa na seleção de informações financeiras."},"answer":"B","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"A prudência é exercício de cautela sob condições de incerteza e auxilia a neutralidade (2.16).","url":"https://www.tecconcursos.com.br/questoes/3607248"}},{"kind":"quiz","ref":"2.16","title":"Questão 9 • Prudência e neutralidade","quiz":{"n":9,"original":304,"bank":"FGV - Tec NS (TJ MS)/TJ MS/Analista Técnico-Contábil/2024","question":"Sobre prudência, neutralidade e representação fidedigna, assinale a alternativa correta:","options":{"A":"A neutralidade é incompatível com o exercício de prudência.","B":"Representação fidedigna exige precisão absoluta, sem estimativas.","C":"Alguns pronunciamentos podem conter requisitos assimétricos, como os aplicáveis a provisões e ativos contingentes.","D":"A prudência recomenda superavaliar ativos e receitas e subavaliar passivos e despesas.","E":"Neutralidade significa que a informação não pode influenciar nenhuma decisão."},"answer":"C","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"A neutralidade e a prudência são compatíveis; normas específicas podem adotar tratamentos assimétricos (2.16).","url":"https://www.tecconcursos.com.br/questoes/2908482"}},{"kind":"quiz","ref":"2.16","title":"Questão 10 • Prudência e neutralidade","quiz":{"n":10,"original":7,"bank":"VUNESP - Ana Cont (Rio Preto Prev)/Rio Preto Prev/2026","question":"A respeito da prudência, da relevância e da representação fidedigna na NBC TG Estrutura Conceitual, assinale a alternativa correta:","options":{"A":"Representação fidedigna exige precisão absoluta, sem qualquer incerteza.","B":"Comparabilidade significa uniformizar eventos substancialmente diferentes.","C":"Somente a materialidade quantitativa determina a relevância.","D":"Prudência significa cautela sob incerteza, sem superavaliar ativos/receitas ou subavaliar passivos/despesas de modo sistemático.","E":"Compreensibilidade permite omitir dados relevantes quando forem complexos."},"answer":"D","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Prudência significa cautela em condições de incerteza e não autoriza viés sistemático (2.16).","url":"https://www.tecconcursos.com.br/questoes/3800806"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.17–2.18","title":"Ausência de erros","explanation":"Livre de erros não equivale a exatidão absoluta em todas as medidas. A descrição do fenômeno deve estar sem erros ou omissões relevantes, e o processo usado deve ser selecionado e aplicado sem erros.","points":["Estimativas podem ser fidedignas quando identificadas como estimativas e seus métodos e limitações são explicados."],"example":"Valor calculado com premissas justificadas pode ser fidedigno mesmo que haja incerteza.","tip":"Diferencie estimativa legítima de erro de elaboração."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.19","title":"Incerteza de mensuração","explanation":"A existência de incerteza não impede por si só a utilidade de uma informação. Dependendo do grau de incerteza e das alternativas, uma estimativa pode ou não fornecer representação suficientemente fidedigna.","points":["A divulgação de premissas e das incertezas pode auxiliar a interpretação dos valores."],"example":"Uma provisão estimada com base em evidências e método transparente.","tip":"Incerteza não elimina automaticamente a representação fidedigna."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.20–2.22","title":"Como aplicar as fundamentais","explanation":"A identificação de fenômenos econômicos relevantes, seguida da escolha de representação fidedigna, orienta a elaboração de informações úteis. Se uma informação não pode ser representada fidedignamente, pode ser necessário buscar outra informação relevante.","points":["Não basta relatar fielmente algo irrelevante, nem algo relevante de modo distorcido."],"example":"Uma estimativa relevante e suficientemente fidedigna é preferível a uma medida exata, porém sem utilidade decisória.","tip":"FGV costuma cobrar relevância E representação fidedigna juntas."},{"kind":"quiz","ref":"2.20–2.22","title":"Questão 11 • Como aplicar as fundamentais","quiz":{"n":11,"original":8,"bank":"IESES - Cont (SCGÁS)/SCGÁS/2026","question":"De acordo com o CPC 00 (R2), qual das afirmações descreve corretamente a relação entre relevância e representação fidedigna?","options":{"A":"Uma informação fidedigna deve ser tendenciosa para proteger os investidores.","B":"Uma representação é perfeitamente fidedigna mesmo quando contém erros deliberados.","C":"A informação útil deve tratar de fenômenos relevantes e representar fielmente sua essência econômica.","D":"Representar eventos diferentes como se fossem iguais aumenta necessariamente a comparabilidade."},"answer":"C","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Informação útil requer fenômeno relevante e representação fidedigna de sua essência (2.4, 2.12).","url":"https://www.tecconcursos.com.br/questoes/3804469"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.23–2.24","title":"Características de melhoria","explanation":"Comparabilidade, verificabilidade, tempestividade e compreensibilidade aumentam a utilidade de informações que já sejam relevantes e representadas fidedignamente.","points":["Não substituem as fundamentais e não tornam útil uma informação irrelevante ou não fidedigna."],"example":"Duas demonstrações comparáveis ajudam o usuário somente se os dados de base forem úteis.","tip":"Não classifique verificabilidade como fundamental."},{"kind":"quiz","ref":"2.23–2.24","title":"Questão 12 • Características de melhoria","quiz":{"n":12,"original":247,"bank":"FGV - Ana Geo (CPRM)/CPRM/Contabilidade/2025","question":"Na aplicação das características qualitativas fundamentais e de melhoria, qual das informações abaixo ainda pode ser útil, conforme o CPC 00 (R2)?","options":{"A":"tempestiva, mas não neutra.","B":"verificável, mas não completa.","C":"relevante, mas não comparável.","D":"material, mas não representada fidedignamente.","E":"compreensível, mas com erros materiais de mensuração."},"answer":"C","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Comparabilidade é melhoria; relevância é fundamental, portanto ausência de comparabilidade não necessariamente impede a utilidade (2.20–2.23).","url":"https://www.tecconcursos.com.br/questoes/3730348"}},{"kind":"quiz","ref":"2.23–2.24","title":"Questão 13 • Características de melhoria","quiz":{"n":13,"original":88,"bank":"QUADRIX - Cont (CRQ 5 (RS))/CRQ 5 (RS)/2026","question":"Assinale a alternativa que contém APENAS características qualitativas de melhoria, de acordo com o CPC 00 (R2):","options":{"A":"Relevância, representação fidedigna, tempestividade e compreensibilidade.","B":"Comparabilidade, materialidade, tempestividade e representação fidedigna.","C":"Comparabilidade, capacidade de verificação, tempestividade e compreensibilidade.","D":"Capacidade de verificação, prudência, competência e compreensibilidade.","E":"Relevância, materialidade, capacidade de verificação e representação fidedigna."},"answer":"C","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"As quatro características de melhoria são comparabilidade, verificabilidade, tempestividade e compreensibilidade (2.23).","url":"https://www.tecconcursos.com.br/questoes/4121789"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.24–2.25","title":"Comparabilidade","explanation":"Comparabilidade permite identificar e compreender semelhanças e diferenças entre itens. A decisão geralmente envolve selecionar entre alternativas.","points":["É útil comparar períodos de uma mesma empresa ou empresas diferentes."],"example":"Comparar margem de lucro entre duas entidades com informações adequadas.","tip":"Comparabilidade não significa tratar fatos diferentes como iguais."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.26–2.29","title":"Comparabilidade versus consistência","explanation":"Consistência é utilizar os mesmos métodos para os mesmos itens ao longo do tempo ou entre entidades; ajuda a alcançar comparabilidade, mas não é sinônimo dela.","points":["Uniformidade e comparabilidade também não são sinônimos; coisas iguais devem parecer iguais e diferentes devem parecer diferentes."],"example":"Mudança justificada de política contábil pode melhorar a relevância e ser explicada ao leitor.","tip":"Consistência é meio; comparabilidade é objetivo."},{"kind":"quiz","ref":"2.26–2.29","title":"Questão 14 • Comparabilidade versus consistência","quiz":{"n":14,"original":208,"bank":"FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2025","question":"Em relação às características qualitativas ao selecionar bases de mensuração, julgue as afirmações: (I) usar consistentemente a mesma base para itens semelhantes prejudica a comparabilidade; (II) uma mudança de base pode reduzir a compreensibilidade, mas ser justificada por outras vantagens; (III) a verificabilidade pode ser favorecida pela observação direta de preços ou pela verificação de entradas de modelos. A sequência é:","options":{"A":"V – V – V.","B":"V – V – F.","C":"V – F – V.","D":"F – V – V."},"answer":"D","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Consistência tende a favorecer comparabilidade; mudanças podem reduzir compreensibilidade, e verificações diretas ou indiretas são possíveis (2.24–2.32).","url":"https://www.tecconcursos.com.br/questoes/3607252"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.30–2.32","title":"Capacidade de verificação","explanation":"A capacidade de verificação ajuda usuários independentes e conhecedores a chegar a um consenso de que a informação representa fidedignamente o fenômeno, mesmo que não haja concordância completa.","points":["Verificação direta: observar ou contar. Verificação indireta: verificar dados de entrada e recalcular resultados por técnica ou modelo."],"example":"Conferir o saldo físico do caixa é direto; recalcular custo dos estoques a partir de dados e método é indireto.","tip":"Verificabilidade não exige precisão absoluta nem unanimidade."},{"kind":"quiz","ref":"2.30–2.32","title":"Questão 15 • Capacidade de verificação","quiz":{"n":15,"original":223,"bank":"FGV - Tec (Nittrans)/Nittrans/Contábil/2025","question":"A verificação pode ocorrer de forma direta ou indireta. Qual situação exemplifica verificação INDIRETA?","options":{"A":"Contagem física do dinheiro no caixa.","B":"Inventário físico dos equipamentos em operação.","C":"Consulta direta da cotação de um título negociado no mercado.","D":"Observação direta da quantidade de mercadorias existentes.","E":"Conferência dos dados de entrada e recálculo do valor contábil do estoque pelo método empregado."},"answer":"E","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Verificação indireta exige conferir entradas de modelo, fórmula ou técnica e recalcular sua saída (2.31).","url":"https://www.tecconcursos.com.br/questoes/3664488"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.33","title":"Tempestividade","explanation":"Tempestividade é disponibilizar informações aos tomadores de decisões a tempo para que possam influenciar suas decisões. Informação atrasada tende a perder utilidade, embora algumas informações antigas ainda sirvam para tendências.","points":["É característica de melhoria, não requisito de registro pelo regime de caixa."],"example":"Divulgar uma perda conhecida somente meses depois pode reduzir a utilidade decisória.","tip":"Expressão-chave: a tempo de influenciar decisões."},{"kind":"quiz","ref":"2.33","title":"Questão 16 • Tempestividade","quiz":{"n":16,"original":10,"bank":"FGV - Per OC (PC PI)/PC PI/Perito Criminal/Contabilidade ou Economia/2026","question":"Uma empresa recebeu uma multa de trânsito em dezembro, mas, ao preparar suas demonstrações financeiras, decidiu omitir o fato até o vencimento do prazo de pagamento, embora a informação já fosse necessária aos usuários. Qual característica qualitativa de melhoria foi prejudicada?","options":{"A":"neutralidade.","B":"tempestividade.","C":"continuidade.","D":"materialidade.","E":"compreensibilidade."},"answer":"B","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Tempestividade é a disponibilidade de informação a tempo de influenciar decisões (item 2.33).","url":"https://www.tecconcursos.com.br/questoes/3806419"}},{"kind":"quiz","ref":"2.33","title":"Questão 17 • Tempestividade","quiz":{"n":17,"original":121,"bank":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","question":"Após fortes chuvas provocarem danos aos estoques, um supermercado reconheceu a perda nas informações financeiras do mês em que ocorreu, sem aguardar o recebimento de documento adicional. Essa disponibilização de informação em tempo de influenciar decisões evidencia principalmente:","options":{"A":"neutralidade.","B":"materialidade.","C":"verificabilidade.","D":"tempestividade."},"answer":"D","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Tempestividade significa tornar a informação disponível em tempo de influenciar decisões (2.33).","url":"https://www.tecconcursos.com.br/questoes/3349463"}},{"kind":"quiz","ref":"2.33","title":"Questão 18 • Tempestividade","quiz":{"n":18,"original":154,"bank":"FGV - TDP (DPE RO)/DPE RO/Técnico em Contabilidade/2025","question":"Complete o conceito do CPC 00 (R2): “Tempestividade significa disponibilizar informações aos ______ a tempo para que sejam capazes de ______ suas decisões.”","options":{"A":"tomadores de decisões – modificar.","B":"tomadores de decisões – influenciar.","C":"administradores da entidade – modificar.","D":"administradores da entidade – influenciar.","E":"administradores da entidade – corroborar."},"answer":"B","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"O termo técnico é tomadores de decisões e o efeito é influenciar suas decisões (2.33).","url":"https://www.tecconcursos.com.br/questoes/3444851"}},{"kind":"quiz","ref":"2.33","title":"Questão 19 • Tempestividade","quiz":{"n":19,"original":16,"bank":"Instituto Consulplan - AGP Cont (Pref Viana (ES))/Pref Viana (ES)/2026","question":"Qual característica qualitativa exige que a informação esteja disponível aos tomadores de decisão a tempo de influenciar suas decisões?","options":{"A":"Confiabilidade.","B":"Verificabilidade.","C":"Tempestividade.","D":"Compreensibilidade."},"answer":"C","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Tempestividade é uma das características qualitativas de melhoria (2.33).","url":"https://www.tecconcursos.com.br/questoes/3842548"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.34","title":"Compreensibilidade","explanation":"Compreensibilidade decorre de classificar, caracterizar e apresentar informações de modo claro e conciso.","points":["Informação clara não significa eliminar fatos importantes só porque são difíceis."],"example":"Uma tabela bem identificada torna mais fácil comparar receitas de períodos diferentes.","tip":"Clareza e concisão são importantes, sem omitir complexidade relevante."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.35–2.36","title":"Quem é o usuário presumido","explanation":"Os relatórios se destinam a usuários com conhecimento razoável de negócios e atividades econômicas, que analisam as informações com diligência. Mesmo esses usuários podem precisar de auxílio para assuntos complexos.","points":["Fenômenos difíceis não devem ser omitidos exclusivamente para facilitar a leitura."],"example":"Derivativos complexos podem exigir explicações adicionais em vez de serem excluídos.","tip":"Não presuma um usuário leigo absoluto, nem um especialista infalível."},{"kind":"quiz","ref":"2.35–2.36","title":"Questão 20 • Quem é o usuário presumido","quiz":{"n":20,"original":153,"bank":"FGV - TDP (DPE RO)/DPE RO/Técnico em Contabilidade/2025","question":"O proprietário de uma clínica tem conhecimento razoável das atividades comerciais e econômicas e examina diligentemente as informações financeiras da empresa. Considerando o pressuposto sobre usuários ao tratar da compreensibilidade, assinale a alternativa correta:","options":{"A":"Os relatórios financeiros destinam-se apenas a usuários responsáveis pelo pagamento de tributos.","B":"O proprietário não pode compreender relatórios financeiros, pois só administradores têm esse conhecimento.","C":"Os relatórios são compreensíveis apenas quando dispensam conhecimento de negócios.","D":"Os relatórios são preparados supondo usuários com conhecimento razoável de negócios e que examinam as informações diligentemente.","E":"Os relatórios devem omitir fenômenos econômicos complexos para facilitar a leitura."},"answer":"D","section":"Capítulo 2 • Características qualitativas","adapted":true,"explanation":"Os usuários pressupostos têm conhecimento razoável das atividades de negócios e examinam a informação diligentemente (2.36).","url":"https://www.tecconcursos.com.br/questoes/3444846"}},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.37–2.38","title":"Aplicando as características de melhoria","explanation":"As características de melhoria devem ser maximizadas tanto quanto possível, mas pode haver compensações entre elas. Não há uma ordem fixa de aplicação.","points":["Em certas situações, reduzir uma característica pode ser aceitável para aumentar outra."],"example":"Uma mudança metodológica bem explicada pode melhorar a relevância e afetar comparações históricas.","tip":"Nenhuma característica de melhoria corrige falta de relevância ou fidedignidade."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.39–2.40","title":"Restrição de custo: visão geral","explanation":"O custo de produzir e utilizar informação é uma restrição abrangente aos relatórios financeiros úteis. O benefício da informação deve justificar os custos de fornecimento e uso.","points":["O custo incide sobre preparadores e usuários: coleta, processamento, verificação, interpretação e análise."],"example":"Uma divulgação extremamente cara pode ter benefício inferior ao custo.","tip":"Custo é restrição, não uma das seis características qualitativas."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.41–2.43","title":"Avaliação de custos e benefícios","explanation":"Na avaliação de requisitos de divulgação, consideram-se os custos para as entidades e os benefícios prováveis aos usuários, levando em conta diferentes portes e situações. É um julgamento que pode depender de fatores qualitativos e quantitativos.","points":["O processo de elaboração de normas considera evidências e opiniões sobre custos e benefícios."],"example":"Uma exigência detalhada pode ter impactos diferentes em grandes e pequenas entidades.","tip":"Custo-benefício não autoriza omitir indiscriminadamente informações materiais."},{"kind":"theory","section":"CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS","ref":"2.1–2.43","title":"Revisão final: mapa do Capítulo 2","explanation":"O Capítulo 2 apresenta o critério para avaliar a utilidade das informações dos relatórios financeiros para fins gerais.","points":["Fundamentais: relevância (valor preditivo, confirmatório, materialidade) + representação fidedigna (completude, neutralidade, ausência de erros)."],"example":"Melhoria: comparabilidade, verificabilidade, tempestividade, compreensibilidade. Restrição abrangente: custo.","tip":"Ao responder, identifique primeiro se a banca pergunta por característica fundamental, de melhoria ou restrição."}];const IS_TEACHER=true;const KEY='moreira_cpc00_cap2_interativa_'+(IS_TEACHER?'professor':'aluno')+'_v1';const INKKEY='moreira_cpc00_cap2_professor_tinta_v1';const ANSWERKEY='moreira_cpc00_cap2_teoria_quiz20_'+(IS_TEACHER?'professor':'aluno')+'_v2';const $=s=>document.querySelector(s);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let index=Math.max(0,Math.min(DATA.length,Number(localStorage.getItem(KEY)||0)));let tool='off',color='#172532',size=4,strokes=[],activeStroke=null,ctx=null,startX=0,startY=0;

function playQuizSound(correct){try{let ac=new (window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=correct?740:260;g.gain.setValueAtTime(.09,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.19);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}catch(e){}}
function render(){let h='';if(index===0){h=`<div class="cover"><span class="kicker">CURSO DE CONTABILIDADE PROFESSOR MOREIRA</span><h1>TEORIA - CPC 00 (R2)<br>ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO</h1><div class="big">CAPÍTULO 2 • CARACTERÍSTICAS QUALITATIVAS DE INFORMAÇÕES FINANCEIRAS ÚTEIS</div><p class="lead">Material completo e explicado • Itens 2.1 a 2.43 • <b>20 questões inseridas logo após a teoria correspondente</b> • ${DATA.length} telas de estudo</p><div class="note tip"><strong>Como estudar</strong>Leia cada tela teórica e resolva as questões que surgirem em seguida. A resposta fica verde quando correta e vermelha quando incorreta, com explicação e pontuação salva.${IS_TEACHER?' Para escrever, escolha Caneta ou Marca-texto; para responder, toque em Navegar.':''}</div></div>`;}else{let s=DATA[index-1];if(s.kind==='quiz'){let q=s.quiz,a=quizAnswers()['q'+q.n],snum=quizStats();let options=Object.entries(q.options).map(([letter,txt])=>{let cls=a?(letter===q.answer?'right':(letter===a.selected?'wrong':'')):'';return `<button type="button" class="answerOpt ${cls}" ${a?'disabled':''} data-ans="${safe(letter)}"><span class="letter">${safe(letter)}</span><span>${safe(txt)}</span></button>`}).join('');h=`<div class="kicker">EXERCÍCIO DE FIXAÇÃO • ${safe(q.section.toUpperCase())}</div><span class="ref">CPC 00 (R2) • item ${safe(s.ref)}</span><h2>Questão ${q.n} de 20</h2><div class="quizMeta">${safe(q.bank)}</div><p class="lead questionText">${safe(q.question)}</p><div class="answers">${options}</div>${a?`<aside class="note ${a.correct?'feedbackRight':'feedbackWrong'}"><strong>${a.correct?'✅ Resposta correta!':'❌ Resposta incorreta.'}</strong>Gabarito: ${safe(q.answer)}. ${safe(q.options[q.answer])}<p class="feedbackExplain">${safe(quizExplanation(q,s.ref))}</p></aside>`:'<p class="source">Selecione uma alternativa para conferir o gabarito e a explicação.</p>'}<div class="quizScore">Questões respondidas: ${snum.done}/20 • Acertos: ${snum.correct} • Erros: ${snum.done-snum.correct}</div><div class="source">Questão adaptada do conjunto de 20 questões selecionadas para o Capítulo 2; o PDF inicial apresentava trechos cortados. Texto reconstruído para uso didático e não transcrito literalmente da banca.</div>`;}else{h=`<div class="kicker">${safe(s.section)}</div><span class="ref">CPC 00 (R2) • item ${safe(s.ref)}</span><h2>${safe(s.title)}</h2><p class="lead">${safe(s.explanation)}</p>${s.points.length?'<ul class="list">'+s.points.map(x=>'<li>'+safe(x)+'</li>').join('')+'</ul>':''}${s.example?'<aside class="note"><strong>💡 Exemplo didático</strong>'+safe(s.example)+'</aside>':''}${s.tip?'<aside class="note tip"><strong>🎯 Dica de prova</strong>'+safe(s.tip)+'</aside>':''}<div class="source">Base normativa: CPC 00 (R2), ${safe(s.ref)}. Explicações e exemplos são didáticos e não substituem a redação oficial da norma.</div>`;}}$('#inner').innerHTML=h;if(index>0&&DATA[index-1].kind==='quiz'&&!quizAnswers()['q'+DATA[index-1].quiz.n]){document.querySelectorAll('.answerOpt').forEach(btn=>btn.addEventListener('click',()=>chooseAnswer(DATA[index-1].quiz.n,btn.dataset.ans)))}$('#count').textContent=`${index} / ${DATA.length}`;$('#prev').disabled=index===0;$('#next').disabled=index===DATA.length;$('#bar').style.width=(100*index/DATA.length)+'%';$('#jump').value=String(index);localStorage.setItem(KEY,index);window.scrollTo({top:0,behavior:'instant'});requestAnimationFrame(()=>requestAnimationFrame(syncCanvas));}
function quizExplanation(q,ref){return q.explanation || 'Releia o item '+ref+' do CPC 00 (R2).'}
function move(to){index=Math.max(0,Math.min(DATA.length,to));render()};$('#prev').onclick=()=>move(index-1);$('#next').onclick=()=>move(index+1);$('#restart').onclick=()=>move(0);const jump=$('#jump');[{ref:'CAPA',title:'Início'},...DATA].forEach((s,i)=>{let el=document.createElement('option');el.value=String(i);el.textContent=i===0?'0 • Capa':i+' • '+(s.kind==='quiz'?'📝 ':'')+s.ref+' '+s.title;jump.appendChild(el)});jump.onchange=()=>move(Number(jump.value));
const canvas=$('#ink'),screen=$('#screen');function getAll(){try{return JSON.parse(localStorage.getItem(INKKEY)||'{}')}catch(e){return {}}};function getStrokes(){return getAll()[index]||[]};function saveStrokes(){if(!IS_TEACHER)return;const all=getAll();all[index]=strokes;try{localStorage.setItem(INKKEY,JSON.stringify(all))}catch(e){alert('O navegador não conseguiu salvar mais anotações.')}}
function syncCanvas(){if(!IS_TEACHER)return;const r=screen.getBoundingClientRect(),w=screen.clientWidth,h=screen.scrollHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.style.width=w+'px';canvas.style.height=h+'px';canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);strokes=getStrokes();drawAll();canvas.classList.toggle('enabled',tool!=='off')};function drawStroke(s){if(!ctx||!s.pts?.length)return;const w=screen.clientWidth,h=screen.scrollHeight;ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=s.tool==='eraser'?'#000000':s.color;ctx.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over';ctx.globalAlpha=s.tool==='highlighter'?.3:1;ctx.lineWidth=s.size*(s.tool==='highlighter'?5:s.tool==='eraser'?4:1);ctx.beginPath();s.pts.forEach((p,i)=>{let x=p[0]*w,y=p[1]*h;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});if(s.pts.length===1){let p=s.pts[0];ctx.lineTo(p[0]*w+.15,p[1]*h+.15)}ctx.stroke();ctx.restore()};function drawAll(){if(!ctx)return;ctx.clearRect(0,0,screen.clientWidth,screen.scrollHeight);strokes.forEach(drawStroke)};
function point(ev){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height))]};canvas.addEventListener('pointerdown',ev=>{if(!IS_TEACHER||tool==='off')return;ev.preventDefault();canvas.setPointerCapture(ev.pointerId);activeStroke={tool,color,size,pts:[point(ev)]};strokes.push(activeStroke);drawAll()});canvas.addEventListener('pointermove',ev=>{if(!activeStroke)return;ev.preventDefault();activeStroke.pts.push(point(ev));drawAll()});function finish(){if(activeStroke){activeStroke=null;saveStrokes()}}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
if(IS_TEACHER){document.querySelectorAll('[data-tool]').forEach(btn=>btn.addEventListener('click',()=>{tool=btn.dataset.tool;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));canvas.classList.toggle('enabled',tool!=='off')}));document.querySelectorAll('[data-color]').forEach(btn=>btn.addEventListener('click',()=>{color=btn.dataset.color;document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('active',b===btn))}));$('#penSize').onchange=e=>size=Number(e.target.value);$('#clearInk').onclick=()=>{if(confirm('Apagar as anotações desta tela?')){strokes=[];saveStrokes();drawAll()}};window.addEventListener('resize',()=>requestAnimationFrame(syncCanvas));}
screen.addEventListener('touchstart',e=>{if(IS_TEACHER&&tool!=='off')return;if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY}},{passive:true});screen.addEventListener('touchend',e=>{if(IS_TEACHER&&tool!=='off')return;if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*1.5)move(index+(dx<0?1:-1))},{passive:true});window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')move(index+1);if(e.key==='ArrowLeft')move(index-1)});render();
</script></body></html>
